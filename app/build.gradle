plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diy.sleepguard'
    compileSdk 34

    defaultConfig {
        applicationId "com.diy.sleepguard"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
