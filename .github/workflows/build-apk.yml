name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 定位工程目录（套没套一层文件夹都行）
        run: |
          DIR=$(dirname "$(find . -maxdepth 3 -name settings.gradle | head -n 1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "工程目录 = $DIR"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 debug apk
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: 上传 apk
        uses: actions/upload-artifact@v4
        with:
          name: sleepguard-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
