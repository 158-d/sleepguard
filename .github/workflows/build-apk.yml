name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  GRADLE_VERSION: "8.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 定位工程目录（套没套一层文件夹都行）
        run: |
          DIR=$(dirname "$(find . -maxdepth 3 -name settings.gradle | head -n 1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "工程目录 = $DIR"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 gradle/actions/setup-gradle：它会走 GitHub 的缓存服务，
      # 缓存服务偶尔返回 400 会让整个构建失败。这里直接下载发行版，不依赖缓存。
      - name: 下载 Gradle
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: 编译 debug apk
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: 上传 apk
        uses: actions/upload-artifact@v4
        with:
          name: sleepguard-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
